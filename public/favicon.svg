<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="gcpInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#gcpGrad)" />
  
  <!-- Inner Dark Canvas -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="url(#gcpInner)" stroke="#334155" stroke-width="0.75" />

  <!-- Stylized G Monogram -->
  <path d="M 42 22 C 38 18 26 18 20 24 C 14 30 14 38 20 44 C 26 50 38 50 43 44 C 45 42 46 39 46 35 L 32 35 L 32 30 L 51 30 C 51 39 48 46 44 49 C 36 57 22 56 15 48 C 8 40 8 28 16 19 C 24 11 38 11 46 18 Z" fill="url(#gcpGrad)" />

  <!-- Sparkle Star Accent -->
  <path d="M 46 12 Q 46 19 53 19 Q 46 19 46 26 Q 46 19 39 19 Q 46 19 46 12 Z" fill="#fbbf24" filter="url(#glow)" />
</svg>
